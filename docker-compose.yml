services:
  mongodb:
    image: mongo:7
    container_name: srishti_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: s25
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongo --eval \"db.adminCommand('ping')\" || mongosh --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build: .
    container_name: srishti_app
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      - PORT=4173
      - MONGODB_URI=mongodb://mongodb:27017/s25
      - SESSION_SECRET=srishti2k25_s3cr3t_k3y_ch4ng3_m3
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
