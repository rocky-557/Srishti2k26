services:
  mongodb:
    image: mongo:7
    container_name: srishti_mongodb
    restart: unless-stopped
    ports:
      - "27526:27017"
    environment:
      MONGO_INITDB_DATABASE: s25
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build: .
    container_name: srishti_app
    restart: unless-stopped
    ports:
      - "8526:8526"
    environment:
      - PORT=8526
      - MONGODB_URI=mongodb://mongodb:27017/s25
      - SESSION_SECRET=srishti2k25_s3cr3t_k3y_ch4ng3_m3
      - STATIC_DIR=/app/Srishti_2k26_repo
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./Srishti_2k26_repo:/app/Srishti_2k26_repo
      - ./public:/app/public

volumes:
  mongo_data:
    driver: local
