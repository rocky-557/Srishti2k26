<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <div class="container my-5" style="position:relative; z-index:10;">
        <div class="row justify-content-center">

                        <div class="d-flex align-items-center gap-3">

                                style="width:44px; height:44px; object-fit:contain; mix-blend-mode:screen; filter:drop-shadow(0 0 10px rgba(201,162,39,0.8));">
                            <div>
                                <div class="tagline-badge mb-1">✏️ EDIT RECORD</div>
                                <h4 class="mb-0 section-title fs-3"><i class="bi bi-pencil-square me-2"></i>Edit Member Details</h4>
                            </div>
                        </div>
                    </div>
                    <div class="card-body px-4 pb-4">

                        <div id="message-container"></div>

                        <!-- Search first: no ?id= needed -->
                        <div id="search-section">
                            <div class="row g-3 align-items-end">
                                <div class="col-md-9">
                                    <label class="form-label">Search Member (SRiSHTi ID / Mobile / Email / Name)</label>
                                    <input type="text" class="form-control" id="member_search" placeholder="e.g. SRiSHTi251024, 9876543210, tony@stark.io, Tony">
                                </div>
                                <div class="col-md-3">
                                    <button type="button" class="btn btn-primary w-100" id="search-btn"><i class="bi bi-search me-1"></i> Search</button>
                                </div>
                            </div>
                            <div id="search-results" class="mt-3"></div>
                        </div>

                        <form id="edit-member-form" style="display:none;">
                            <input type="hidden" name="id" id="member_id" value="">
                            
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Name</label>
                                    <input type="text" class="form-control" name="name" id="member_name" placeholder="Member Name" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" name="email" id="member_email" placeholder="Email Address" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Mobile</label>
                                    <input type="text" class="form-control" name="mobile" id="member_mobile" placeholder="Mobile Number" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">College</label>
                                    <input type="text" class="form-control" name="cgname" id="member_college" placeholder="College Name">
                                </div>

                                <div class="col-12">
                                    <label class="form-label">Events</label>
                                    <select class="form-select" name="events" id="member_events" multiple size="4">
                                        <option value="TECH NEXUS">TECH NEXUS</option>
                                        <option value="BRAINBYTE 2026">BRAINBYTE 2026</option>
                                        <option value="THRILLER TECHSCAPE">THRILLER TECHSCAPE</option>
                                        <option value="TECHTOPIA">TECHTOPIA</option>
                                        <option value="CASE ZERO : THE FINAL VERDICT">CASE ZERO : THE FINAL VERDICT</option>
                                        <option value="MYSTERY VOYAGE – Unveil the truth">MYSTERY VOYAGE – Unveal the truth</option>
                                        <option value="ROAD TO ENDGAME">ROAD TO ENDGAME</option>
                                        <option value="INFINITY CHASE">INFINITY CHASE</option>
                                        <option value="MARVEL ROYALE">MARVEL ROYALE</option>
                                        <option value="BATTLE NEXUS">BATTLE NEXUS</option>
                                        <option value="THE AUCTION ARENA">THE AUCTION ARENA</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Workshops</label>
                                    <select class="form-select" name="workshops" id="member_workshops" multiple size="6">
                                        <option value="From Pixels to Intelligence: Hands-on Computer Vision with YOLO">From Pixels to Intelligence: Hands-on Computer Vision with YOLO</option>
                                        <option value="Powering Future Mobility: Hands-on EV Electronics Design with KiCad">Powering Future Mobility: Hands-on EV Electronics Design with KiCad</option>
                                        <option value="Automotive ECU Development: Hands-on Model-Based Design with Simulink">Automotive ECU Development: Hands-on Model-Based Design with Simulink</option>
                                        <option value="Power Electronics: From MATLAB Simulation to Hardware Implementation">Power Electronics: From MATLAB Simulation to Hardware Implementation</option>
                                        <option value="Industrial IoT & Industry 4.0 – Industrial Communication Protocols, Edge Gateways & Cloud Data Visualization">Industrial IoT & Industry 4.0</option>
                                        <option value="The Future of Automotive Safety: Advanced Driver Assistance Systems (ADAS)">The Future of Automotive Safety: ADAS</option>
                                        <option value="ROS 2 Jazzy: From Bot simulation to Autonomous Robotics with TurtleBot3">ROS 2 Jazzy: From Bot simulation to Autonomous Robotics</option>
                                        <option value="Building Your Own AI Assistant: From Concept to Implementation">Building Your Own AI Assistant</option>
                                        <option value="UI/UX Design with Figma & AI: From Ideas to Interactive Prototypes">UI/UX Design with Figma & AI</option>
                                        <option value="AI-Powered Digital Twins: Modeling, Simulation & Intelligent Systems">AI-Powered Digital Twins</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Paper Presentations</label>
                                    <select class="form-select" name="paperpres" id="member_paperpres" multiple size="5">
                                        <option value="TwinTech 2026">TwinTech 2026</option>
                                        <option value="VoltIQ 2026">VoltIQ 2026</option>
                                        <option value="Mediverse">Mediverse</option>
                                        <option value="NextGen">NextGen</option>
                                        <option value="NextWave">NextWave</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Flagship Events</label>
                                    <select class="form-select" name="flagship" id="member_flagship" multiple size="6">
                                        <option value="DEVSPRINT">DEVSPRINT</option>
                                        <option value="REVERSE ENGINEERING CHALLENGE">REVERSE ENGINEERING CHALLENGE</option>
                                        <option value="VisionX">VisionX</option>
                                        <option value="MAZEBOTICS – RESCUE PROTOCOL">MAZEBOTICS – RESCUE PROTOCOL</option>
                                        <option value="ROBO DOMINION -Where Strategy Meets Strength">ROBO DOMINION</option>
                                        <option value="BOT BLITZ">BOT BLITZ</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">General Fee Status</label>
                                    <select class="form-select" name="genfee" id="member_genfee">
                                        <option value="unpaid">Unpaid</option>
                                        <option value="paid">Paid</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Accommodation</label>
                                     <select class="form-select" name="accomodation" id="member_accomodation">
                                        <option value="No">No</option>
                                        <option value="Yes">Yes</option>
                                    </select>
                                </div>
                            </div>

                            <hr style="border-color: var(--border-color);" class="my-4">

                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                <a href="dashboard.html" class="btn btn-outline-primary"><i class="bi bi-arrow-left-circle me-1"></i> Back to Dashboard</a>
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-outline-danger" id="delete-member-btn"><i class="bi bi-trash-fill me-1"></i> Delete Attendee</button>
                                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i> Save Changes</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Particle Canvas -->
    <script>
    (function () {
        const canvas = document.getElementById('particleCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const PALETTE = ['rgba(201,162,39,','rgba(240,192,64,','rgba(226,54,54,','rgba(192,200,216,','rgba(26,109,189,'];
        const COUNT = 45;
        let W, H, particles = [];
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        function spawnParticle(fb) {
            const r = 0.8 + Math.random() * 1.6;
            return { x: Math.random() * W, y: fb ? H + r : Math.random() * H, r,
                alpha: 0.1 + Math.random() * 0.45, speed: 0.12 + Math.random() * 0.28,
                drift: (Math.random() - 0.5) * 0.14,
                color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
                pulse: Math.random() * Math.PI * 2 };
        }
        function init() { resize(); particles = Array.from({ length: COUNT }, () => spawnParticle(false)); }
        let lt = 0;
        function render(ts) {
            const dt = Math.min(ts - lt, 50); lt = ts; ctx.clearRect(0, 0, W, H);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.y -= p.speed * (dt / 16.67); p.x += p.drift * (dt / 16.67); p.pulse += 0.025 * (dt / 16.67);
                const a = Math.max(0, p.alpha * (0.8 + 0.2 * Math.sin(p.pulse)));
                if (p.y < -p.r * 4 || p.x < -20 || p.x > W + 20) { particles[i] = spawnParticle(true); continue; }
                const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
                g.addColorStop(0, p.color + a.toFixed(3) + ')');
                g.addColorStop(0.4, p.color + (a * 0.5).toFixed(3) + ')');
                g.addColorStop(1, p.color + '0)');
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
            }
            requestAnimationFrame(render);
        }
        window.addEventListener('resize', resize, { passive: true });
        init(); requestAnimationFrame(render);
    })();
    </script>

    <script>
        $(document).ready(function() {
            // Search members by SRiSHTi ID / mobile / email / name
            async function doSearch() {
                const q = $('#member_search').val().trim();
                if (!q) return;
                $('#search-results').html('<div class="text-center py-2"><span class="spinner-border spinner-border-sm"></span> Searching...</div>');
                try {
                    const res = await fetch('/api/admin/members/search', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ query: q, format: 'json' })
                    });
                    const data = await res.json();
                    if (!Array.isArray(data) || data.length === 0) {
                        $('#search-results').html('<div class="alert alert-warning">No members found.</div>');
                        return;
                    }
                    let html = '<div class="list-group">';
                    data.slice(0, 20).forEach(m => {
                        const sid = 'SRiSHTi25' + m.memberId;
                        html += `<button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" data-id="${m.memberId}">
                            <span><strong>${m.name || ''}</strong> <small class="text-muted">${sid} • ${m.mobile || ''} • ${m.email || ''}</small></span>
                            <span class="badge ${m.genfee === 'paid' ? 'bg-success' : 'bg-warning text-dark'}">${m.genfee === 'paid' ? 'Paid' : 'Unpaid'}</span>
                        </button>`;
                    });
                    html += '</div>';
                    $('#search-results').html(html);
                } catch (e) {
                    $('#search-results').html('<div class="alert alert-danger">Search failed.</div>');
                }
            }

            $('#search-btn').on('click', doSearch);
            $('#member_search').on('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
            $('#search-results').on('click', 'button[data-id]', function() {
                loadMember($(this).data('id'));
            });

            async function loadMember(memberId) {
                $('#member_id').val(memberId);
                try {
                    const res = await fetch('/api/admin/members/' + memberId);
                    const data = await res.json();
                    if (data.id !== undefined) {
                        const m = data;
                        $('#member_name').val(m.name || '');
                        $('#member_email').val(m.email || '');
                        $('#member_mobile').val(m.mobile || '');
                        $('#member_college').val(m.collegeName || m.college || '');
                        $('#member_genfee').val(m.genfee === 'paid' ? 'paid' : 'unpaid');
                        $('#member_accomodation').val(m.accommodation === 'Yes' ? 'Yes' : 'No');

                        $('#member_events').val(m.events ? m.events.split(', ') : []);
                        $('#member_workshops').val(m.workshops ? m.workshops.split(', ') : []);
                        $('#member_paperpres').val(m.paperpres ? m.paperpres.split(', ') : []);
                        $('#member_flagship').val(m.flagship ? m.flagship.split(', ') : []);

                        $('#edit-member-form').show();
                        $('#edit-member-form')[0].scrollIntoView({ behavior: 'smooth' });
                    }
                } catch (e) {
                    console.error('Error fetching member:', e);
                }
            }

            // Support legacy ?id= deep link
            const idParam = new URLSearchParams(window.location.search).get('id');
            if (idParam) {
                $('#member_search').val(idParam);
                doSearch().then(() => {
                    // Auto-load if exactly one match
                    const first = $('#search-results button[data-id]').first();
                    if (first.length === 1 && String(first.data('id')) === String(idParam)) {
                        loadMember(idParam);
                    }
                });
            }

            $('#edit-member-form').on('submit', async function(e) {
                e.preventDefault();
                const payload = {
                    id: $('#member_id').val(),
                    name: $('#member_name').val(),
                    email: $('#member_email').val(),
                    mobile: $('#member_mobile').val(),
                    cgname: $('#member_college').val(),
                    genfee: $('#member_genfee').val(),
                    accomodation: $('#member_accomodation').val(),
                    events: $('#member_events').val() || [],
                    workshops: $('#member_workshops').val() || [],
                    papers: $('#member_paperpres').val() || [],
                    flagship: $('#member_flagship').val() || []
                };

                try {
                    const res = await fetch('/api/admin/members/update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        $('#message-container').html('<div class="alert alert-success"><i class="bi bi-check-circle-fill me-2"></i>' + data.message + ' Redirecting...</div>');
                        setTimeout(function() {
                            window.location.href = 'dashboard.html';
                        }, 1200);
                    } else {
                        $('#message-container').html('<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>' + (data.message || 'Update failed') + '</div>');
                    }
                } catch (err) {
                    $('#message-container').html('<div class="alert alert-danger">Server connection error.</div>');
                }
            });

            $('#delete-member-btn').on('click', async function() {
                const memberId = $('#member_id').val();
                const memberName = $('#member_name').val();
                if (!memberId) return;

                if (confirm(`Are you sure you want to permanently delete "${memberName}" (ID: ${memberId}) and all their registrations?`)) {
                    const btn = $(this);
                    btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-1"></span> Deleting...');
                    try {
                        const res = await fetch('/api/admin/members/delete', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ memberId })
                        });
                        const data = await res.json();
                        if (data.status === 'success') {
                            alert(data.message || 'Member deleted.');
                            window.location.href = 'dashboard.html';
                        } else {
                            alert(data.message || 'Failed to delete member.');
                            btn.prop('disabled', false).html('<i class="bi bi-trash-fill me-1"></i> Delete Attendee');
                        }
                    } catch (err) {
                        alert('Error deleting member: ' + err.message);
                        btn.prop('disabled', false).html('<i class="bi bi-trash-fill me-1"></i> Delete Attendee');
                    }
                }
            });
        });
    </script>
</body>
</html>
