<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Login to Srishti 2k26 - PSG College of Technology's premier national-level technical symposium.">
  <title>Srishti 2k26 | Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cinematic.css">
  <link rel="stylesheet" href="css/gauntlet-cursor.css?v=1">
</head>

<body>

  <!-- ===== CINEMATIC LIGHTING LAYER ===== -->
  <!-- 1. Dark readability overlay (40% opacity) above avengers.jpg -->
  <div class="cin-overlay"></div>

  <!-- 2. Character ambient glows: Iron Man / Thor / Scarlet Witch -->
  <div class="cin-glow-iron"></div>
  <div class="cin-glow-thor"></div>
  <div class="cin-glow-witch"></div>

  <!-- 3. Warm glow behind the login card -->
  <div class="cin-glow-card"></div>

  <!-- 4. Bloom warmth over bright image areas -->
  <div class="cin-bloom-layer"></div>

  <!-- 5. Edge vignette — draws focus toward center -->
  <div class="cin-vignette"></div>

  <!-- 6. Sweeping diagonal volumetric light rays -->
  <div class="cin-rays-wrap" aria-hidden="true">
    <div class="cin-ray cin-ray-1"></div>
    <div class="cin-ray cin-ray-2"></div>
    <div class="cin-ray cin-ray-3"></div>
  </div>

  <!-- 7. Floating glowing sparks & embers (Canvas) -->
  <canvas id="particleCanvas" aria-hidden="true"></canvas>

  <!-- ===== PAGE CONTENT ===== -->
  <div class="page-wrapper center-layout">

    <div class="form-container">
      <div class="form-logo-wrap">
        <a href="home.html" title="Back to Home"
          style="display: inline-flex; align-items: center; justify-content: center; gap: 24px; text-decoration: none;">
          <img src="assets/psg_logo.png" alt="PSG College Logo" class="form-top-logo psg-college-logo"
            style="height: 105px; width: auto; max-width: 240px; filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.5));">
          <img src="assets/srishti26_logo_tight.png" alt="Srishti 2K26 Logo" class="form-top-logo"
            style="width: 330px; max-width: 80%;">
        </a>
      </div>

      <header>
        <h1>Welcome Back</h1>
        <p>Sign in to Srishti 2k26 — pick up where you left off.</p>
      </header>

      <form id="loginForm" novalidate>
        <div class="form-grid">

          <div class="form-group full-width" id="group-srishtiid">
            <label for="srishtiId">SRiSHTi ID or Email <span>*</span></label>
            <input type="text" id="srishtiId" name="srishtiId" placeholder="e.g. SRiSHTi251024 or you@email.com" autocomplete="username" required>
            <span class="error-message">Please enter your SRiSHTi ID or registered email</span>
          </div>

          <div class="form-group full-width" id="group-phone">
            <label for="phone">Registered Mobile Number <span>*</span></label>
            <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" autocomplete="tel" maxlength="10" required>
            <span class="error-message">Please enter the 10-digit mobile number you registered with</span>
          </div>

        </div>

        <button type="submit" class="submit-btn" id="loginBtn">
          <span>Login</span>
        </button>
      </form>

      <div class="form-footer">
        Don't have an account? <a href="register.html">Sign Up</a>
      </div>
    </div>

  </div>


  <script src="login.js?v=11"></script>
  <script src="cinematic.js"></script>
</body>

</html>
