<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Login to Srishti 2k26 - PSG College of Technology's premier national-level technical symposium.">
  <title>Srishti 2k26 | Login</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="cinematic.css">
</head>

<body>

  <!-- ===== CINEMATIC LIGHTING LAYER ===== -->
  <!-- 1. Dark readability overlay (40% opacity) above avengers.jpg -->
  <div class="cin-overlay"></div>

  <!-- 2. Character ambient glows: Iron Man / Thor / Scarlet Witch -->
  <div class="cin-glow-iron"></div>
  <div class="cin-glow-thor"></div>
  <div class="cin-glow-witch"></div>

  <!-- 3. Warm glow behind the login card -->
  <div class="cin-glow-card"></div>

  <!-- 4. Bloom warmth over bright image areas -->
  <div class="cin-bloom-layer"></div>

  <!-- 5. Edge vignette — draws focus toward center -->
  <div class="cin-vignette"></div>

  <!-- 6. Sweeping diagonal volumetric light rays -->
  <div class="cin-rays-wrap" aria-hidden="true">
    <div class="cin-ray cin-ray-1"></div>
    <div class="cin-ray cin-ray-2"></div>
    <div class="cin-ray cin-ray-3"></div>
  </div>

  <!-- 7. Floating glowing sparks & embers (Canvas) -->
  <canvas id="particleCanvas" aria-hidden="true"></canvas>

  <!-- ===== PAGE CONTENT ===== -->
  <div class="page-wrapper">

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="grid-overlay"></div>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>

      <div class="left-content">
        <!-- Centered Logo -->
        <div class="logo-space">
          <img src="assets/SRISHTI2K26 LOGO RED.png" alt="Srishti 2K26 Logo" class="logo-img">
        </div>

        <!-- Heading & Description -->
        <div class="hero-text">
          <h2 class="hero-title" data-typewriter>Srishti 2K26</h2>
          <p class="hero-desc" data-typewriter>
            Welcome back to PSG College of Technology's premier national-level technical symposium.
            Sign in to access your dashboard and participate in exciting events.
          </p>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="form-container">
        <header>
          <h1>Login</h1>
        </header>

        <form id="loginForm" novalidate>
          <div class="form-group" id="group-email">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <span class="error-message">Please enter a valid email address</span>
          </div>

          <div class="form-group" id="group-password" style="margin-top: 1rem;">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <button type="button" class="toggle-password" aria-label="Toggle Password Visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <span class="error-message">Password is required</span>
          </div>

          <div class="forgot-password-wrap">
            <a href="home.html#contact" class="forgot-password-btn" id="forgotPasswordBtn"><i class="bi bi-telephone-fill me-1"></i>Forgot Password? Contact Us</a>
          </div>

          <button type="submit" class="submit-btn" id="loginBtn">
            <span>Login</span>
          </button>
        </form>

        <div class="form-footer">
          Don't have an account? <a href="register.html">Sign Up</a>
        </div>
      </div>
    </div>

  </div>

  <script src="login.js?v=9"></script>
  <script src="cinematic.js"></script>
</body>

</html>
