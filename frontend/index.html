<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srishti 2K26 - Stark Shield Cinematic</title>

    <!-- High-End Cinematic Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@600;700;900&family=Oswald:wght@400;500;700&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- GSAP for Master Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Three.js for cosmic background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>



    <style>
        :root {
            --marvel-red: #e23636;
            --endgame-gold: #ffb700;
            --space-black: #020305;
            --hud-accent: #e23636;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--space-black);
            overflow: hidden;
            color: #fff;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ================ PHASE 1: MARVEL FLIP ================ */
        #marvel-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Deep cinematic dark → crimson radial — like the real Marvel Studios card */
            background:
                radial-gradient(ellipse at 50% 50%,
                    #1a0000 0%,
                    #2d0303 25%,
                    #4a0808 50%,
                    #1a0000 100%);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        /* Vignette layer that sits on top of the bg */
        #marvel-intro::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center,
                    transparent 30%,
                    rgba(0, 0, 0, 0.55) 70%,
                    rgba(0, 0, 0, 0.88) 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Subtle rolling scanlines */
        #marvel-intro::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 3px,
                    rgba(0, 0, 0, 0.08) 3px,
                    rgba(0, 0, 0, 0.08) 4px);
            z-index: 0;
            pointer-events: none;
            animation: scanline-roll 8s linear infinite;
        }

        @keyframes scanline-roll {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 80px;
            }
        }

        /* ---- IEEE Cinematic Title ---- */
        #ieee-title-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .ieee-line-top {
            font-family: 'Cinzel', serif;
            font-size: clamp(4rem, 15vw, 15rem);
            font-weight: 900;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 10px;
            color: #fff;
            /* Use cover to retain exact quality without artificial zoom, keeping the image smooth and crisp */
            background-image: url('assets/image.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            -webkit-text-fill-color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            /* Punch up visibility: brighter, more saturated, higher contrast */
            filter: brightness(1.8) contrast(1.3) saturate(1.5);
            /* Clean static background text */
            animation: letter-charge 0.8s ease-out forwards;
            text-shadow: none;
        }

        .ieee-number-sub {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 25px;
            display: inline-block;
            margin-top: 20px;
            color: #ffb700;
            text-shadow: 0 0 30px rgba(255, 183, 0, 0.8);
        }

        @keyframes marvel-flip-bg {

            0%,
            24% {
                background-image: url('assets/image.jpg');
            }

            25%,
            49% {
                background-image: url('assets/image copy.jpg');
            }

            50%,
            74% {
                background-image: url('assets/image copy 2.jpg');
            }

            75%,
            100% {
                background-image: url('assets/image copy 3.jpg');
            }
        }

        .ieee-line-bottom {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(1.5rem, 3.5vw, 2.5rem);
            font-weight: 800;
            line-height: 1;
            /* No uppercase transform, so 'Presents' stays as 'P' caps only */
            letter-spacing: 15px;
            color: #d1d5db;
            text-shadow:
                0 0 15px rgba(209, 213, 219, 0.7),
                0 0 40px rgba(209, 213, 219, 0.3);
            animation: silver-surge 1.4s ease-out forwards, silver-pulse 2.5s ease-in-out 1.4s infinite;
            margin-top: 4px;
        }

        /* Smooth elegant fade for IEEE SC title */
        @keyframes letter-charge {
            0% {
                opacity: 0;
                filter: brightness(2) blur(10px);
            }

            100% {
                opacity: 1;
                filter: brightness(1.8) blur(0px);
            }
        }

        @keyframes silver-surge {
            0% {
                opacity: 0;
                letter-spacing: 25px;
            }

            100% {
                opacity: 1;
                letter-spacing: 25px;
            }
        }

        @keyframes silver-pulse {

            0%,
            100% {
                text-shadow: 0 0 15px rgba(209, 213, 219, 0.7), 0 0 40px rgba(209, 213, 219, 0.3);
            }

            50% {
                text-shadow: 0 0 25px rgba(255, 255, 255, 1), 0 0 60px rgba(209, 213, 219, 0.6), 0 0 5px #fff;
            }
        }

        /* Horizontal power-line sweep behind the text */
        #ieee-title-wrap::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -60px;
            width: calc(100% + 120px);
            height: 2px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(226, 54, 54, 0.9) 30%,
                    rgba(255, 183, 0, 0.9) 50%,
                    rgba(226, 54, 54, 0.9) 70%,
                    transparent 100%);
            animation: power-line 1s ease-out forwards;
            opacity: 0;
            transform: scaleX(0);
        }

        @keyframes power-line {
            0% {
                opacity: 0;
                transform: scaleX(0);
            }

            30% {
                opacity: 1;
                transform: scaleX(1);
            }

            70% {
                opacity: 0.6;
            }

            100% {
                opacity: 0;
                transform: scaleX(1);
            }
        }

        /* Scanline sweep */
        #ieee-title-wrap::after {
            content: '';
            position: absolute;
            top: -20%;
            left: 0;
            width: 100%;
            height: 140%;
            background: linear-gradient(transparent 0%,
                    rgba(226, 54, 54, 0.06) 48%,
                    rgba(255, 255, 255, 0.04) 50%,
                    rgba(226, 54, 54, 0.06) 52%,
                    transparent 100%);
            animation: scan-pass 0.7s ease-in 0.2s forwards;
            opacity: 0;
        }

        @keyframes scan-pass {
            0% {
                opacity: 0;
                transform: translateY(-60%);
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translateY(60%);
            }
        }

        .marvel-box {
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 40px;
            height: 130px;
            opacity: 0;
            z-index: 101;
            transform: scale(0.5);
            white-space: nowrap;
            /* Deep metallic red body */
            background:
                linear-gradient(180deg,
                    rgba(255, 255, 255, 0.07) 0%,
                    rgba(255, 255, 255, 0.00) 40%,
                    rgba(0, 0, 0, 0.22) 100%),
                linear-gradient(135deg,
                    #6b0000 0%,
                    #c01010 25%,
                    #e23636 45%,
                    #b80f0f 70%,
                    #5a0000 100%);
            /* Chrome border: top highlight → dark bottom */
            border-top: 2px solid rgba(255, 200, 200, 0.85);
            border-left: 2px solid rgba(255, 160, 160, 0.55);
            border-right: 2px solid rgba(100, 0, 0, 0.8);
            border-bottom: 2px solid rgba(60, 0, 0, 0.9);
            /* Multi-layer glow: outer cinematic bloom + tight edge */
            box-shadow:
                0 0 0 1px rgba(226, 54, 54, 0.4),
                0 0 30px 6px rgba(226, 54, 54, 0.55),
                0 0 80px 20px rgba(180, 10, 10, 0.35),
                0 25px 60px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 200, 200, 0.25),
                inset 0 -2px 0 rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Inner highlight sheen that sweeps across on impact */
        .marvel-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(105deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.06) 40%,
                    rgba(255, 255, 255, 0.14) 50%,
                    rgba(255, 255, 255, 0.06) 60%,
                    transparent 100%);
            animation: box-sheen 2.4s ease-out 0.1s forwards;
        }

        @keyframes box-sheen {
            0% {
                left: -120%;
            }

            60% {
                left: 130%;
            }

            100% {
                left: 130%;
            }
        }

        /* Gold separator line below the main text */
        .marvel-box::after {
            content: '';
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 0%;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 183, 0, 0.9) 30%,
                    rgba(255, 220, 80, 1) 50%,
                    rgba(255, 183, 0, 0.9) 70%,
                    transparent 100%);
            box-shadow: 0 0 8px rgba(255, 183, 0, 0.7);
            animation: gold-line-expand 0.6s ease-out 0.3s forwards;
        }

        @keyframes gold-line-expand {
            to {
                width: 75%;
            }
        }

        .marvel-box-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.2rem, 5.5vw, 5rem);
            font-weight: 900;
            letter-spacing: 14px;
            text-transform: uppercase;
            /* Chrome white with subtle gold warmth */
            color: #fff;
            background: linear-gradient(180deg,
                    #ffffff 0%,
                    #ffe8c8 40%,
                    #fff0dc 70%,
                    #d4a060 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            /* Emboss glow: tight white core + red bloom */
            filter:
                drop-shadow(0 0 2px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 8px rgba(255, 210, 150, 0.7)) drop-shadow(0 0 20px rgba(226, 54, 54, 0.6));
            position: relative;
            z-index: 1;
            margin-bottom: 16px;
            /* room for the gold line */
        }

        /* ================ PHASE 2: THOR CINEMATIC REVEAL ================ */
        #cinematic-reveal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background:
                radial-gradient(ellipse at 50% 35%,
                    #07193f 0%,
                    #030e26 45%,
                    #010612 80%,
                    #000308 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            overflow: hidden;
        }

        /* Thor storm atmosphere overlay */
        #red-atmosphere {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 20%, rgba(0, 180, 255, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 80%, rgba(120, 0, 255, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 70%, rgba(0, 100, 255, 0.08) 0%, transparent 50%);
            mix-blend-mode: screen;
            animation: storm-pulse 4s ease-in-out infinite;
        }

        @keyframes storm-pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1.0;
            }
        }

        /* ---- THOR LIGHTNING BOLTS ---- */
        #lightning-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            overflow: hidden;
        }

        .thor-bolt {
            position: absolute;
            pointer-events: none;
            filter: blur(0.5px);
        }

        /* Thunder shockwave rings */
        #thunder-rings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            pointer-events: none;
        }

        .thunder-ring {
            position: absolute;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            border: 2px solid rgba(0, 200, 255, 0.9);
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.6), inset 0 0 15px rgba(0, 200, 255, 0.3);
            animation: thunder-ring-expand 1.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes thunder-ring-expand {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }

            70% {
                opacity: 0.4;
            }

            100% {
                transform: translate(-50%, -50%) scale(4);
                opacity: 0;
            }
        }

        /* Electric horizon line — disabled */
        #electric-horizon {
            display: none !important;
        }

        @keyframes horizon-flare {

            0%,
            100% {
                opacity: 0;
                transform: scaleX(0.3);
            }

            10%,
            90% {
                opacity: 0;
            }

            50% {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* Mjolnir impact burst — disabled */
        #mjolnir-burst,
        .mjolnir-impact {
            display: none !important;
            opacity: 0 !important;
        }

        /* ---- COSMIC WEBGL CANVAS ---- */
        #cosmic-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ---- FILM GRAIN OVERLAY ---- */
        #film-grain {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            animation: grain-shift 0.1s steps(1) infinite;
        }

        @keyframes grain-shift {
            0% {
                transform: translate(0, 0);
            }

            10% {
                transform: translate(-2%, -2%);
            }

            20% {
                transform: translate(2%, 2%);
            }

            30% {
                transform: translate(-1%, 1%);
            }

            40% {
                transform: translate(1%, -1%);
            }

            50% {
                transform: translate(-2%, 1%);
            }

            60% {
                transform: translate(2%, -2%);
            }

            70% {
                transform: translate(-1%, -1%);
            }

            80% {
                transform: translate(1%, 2%);
            }

            90% {
                transform: translate(-2%, 2%);
            }

            100% {
                transform: translate(2%, 1%);
            }
        }

        /* ---- VIGNETTE + CHROMATIC ABERRATION ---- */
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    transparent 40%,
                    rgba(0, 0, 0, 0.4) 70%,
                    rgba(0, 0, 0, 0.85) 100%);
        }

        /* ---- MAIN STAGE (parallax container) ---- */
        #stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            will-change: transform;
        }

        /* ---- JARVIS HUD RINGS (SVG) ---- */
        #jarvis-hud {
            display: none !important;
            position: absolute;
            width: min(90vw, 700px);
            height: min(90vw, 700px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
        }

        .hud-ring {
            fill: none;
        }

        @keyframes hud-cw {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes hud-ccw {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-360deg);
            }
        }

        /* ---- LOGO CORE ---- */
        #logo-core {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            opacity: 0;
        }

        /* Logo frame — no border box */
        .logo-frame {
            position: relative;
            padding: 0;
            background: transparent;
            border: none !important;
            box-shadow: none !important;
        }

        @keyframes thor-border-flow {
            0% {
                background-position: 0% 50%;
                box-shadow: 0 0 30px rgba(0, 200, 255, 0.7), 0 0 80px rgba(180, 100, 255, 0.35), 0 0 120px rgba(0, 200, 255, 0.15);
            }

            33% {
                background-position: 100% 50%;
                box-shadow: 0 0 50px rgba(180, 100, 255, 0.9), 0 0 100px rgba(0, 200, 255, 0.4), 0 0 150px rgba(180, 100, 255, 0.2);
            }

            66% {
                background-position: 50% 0%;
                box-shadow: 0 0 40px rgba(255, 220, 0, 0.7), 0 0 90px rgba(0, 200, 255, 0.3), 0 0 130px rgba(255, 220, 0, 0.1);
            }

            100% {
                background-position: 0% 50%;
                box-shadow: 0 0 30px rgba(0, 200, 255, 0.7), 0 0 80px rgba(180, 100, 255, 0.35), 0 0 120px rgba(0, 200, 255, 0.15);
            }
        }

        @keyframes border-flow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .logo-inner {
            overflow: hidden;
            background: transparent;
            padding: 20px 30px;
            position: relative;
            border: none !important;
            box-shadow: none !important;
        }

        /* Scanline sweep disabled */
        .logo-inner::after {
            display: none;
        }

        @keyframes scan-sweep {
            0% {
                top: -40%;
            }

            100% {
                top: 120%;
            }
        }

        #srishtiLogo {
            display: block;
            max-width: min(95vw, 975px);
            height: auto;
            transition: filter 0.5s;
        }

        /* Thor electric flicker on logo */
        @keyframes logo-thor-chroma {

            0%,
            85%,
            100% {
                filter:
                    drop-shadow(0 0 12px rgba(0, 200, 255, 0.7)) drop-shadow(0 0 30px rgba(180, 100, 255, 0.4));
                opacity: 1;
            }

            88% {
                filter:
                    drop-shadow(-4px 0 8px rgba(0, 200, 255, 1)) drop-shadow(4px 0 8px rgba(180, 100, 255, 1)) drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
                opacity: 0.4;
            }

            91% {
                filter:
                    drop-shadow(0 0 20px rgba(0, 200, 255, 1)) drop-shadow(0 0 40px rgba(180, 100, 255, 0.8));
                opacity: 1;
            }

            94% {
                opacity: 0.6;
            }

            97% {
                opacity: 1;
            }
        }

        /* ---- STAT CARDS (Desktop & Mobile Unified Engine) ---- */
        #stat-cards {
            position: absolute;
            bottom: 7%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            opacity: 0;
            width: 90vw;
            max-width: 960px;
        }

        .stat-card:nth-of-type(1) {
            order: 1;
        }

        .explore-btn-container {
            order: 2;
            margin-top: 0 !important;
        }

        .stat-card:nth-of-type(2) {
            order: 3;
        }

        /* Explore Button — solid filled CTA */
        .explore-btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            margin-top: 45px;
            /* Pill button shape */
            background: linear-gradient(135deg, #c01010 0%, #e23636 50%, #a00000 100%);
            border: 2px solid rgba(255, 120, 120, 0.7);
            border-radius: 50px;
            padding: 12px 28px;
            gap: 8px;
            flex-direction: row;
            box-shadow:
                0 0 20px rgba(226, 54, 54, 0.7),
                0 0 50px rgba(226, 54, 54, 0.3),
                inset 0 1px 0 rgba(255, 200, 200, 0.3);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: pulse-explore 2.5s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .explore-btn-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            animation: btn-sheen 3s ease-out infinite;
        }

        @keyframes btn-sheen {
            0% {
                left: -60%;
            }

            60% {
                left: 130%;
            }

            100% {
                left: 130%;
            }
        }

        .explore-btn-container:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow:
                0 0 35px rgba(226, 54, 54, 1),
                0 0 80px rgba(226, 54, 54, 0.5),
                inset 0 1px 0 rgba(255, 200, 200, 0.4);
        }

        .explore-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
        }

        .explore-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            color: #fff;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        @keyframes pulse-explore {

            0%,
            100% {
                box-shadow:
                    0 0 20px rgba(226, 54, 54, 0.7),
                    0 0 50px rgba(226, 54, 54, 0.3),
                    inset 0 1px 0 rgba(255, 200, 200, 0.3);
            }

            50% {
                box-shadow:
                    0 0 40px rgba(226, 54, 54, 1),
                    0 0 80px rgba(226, 54, 54, 0.5),
                    inset 0 1px 0 rgba(255, 200, 200, 0.4);
            }
        }

        .stat-card {
            position: relative;
            padding: 20px 30px;
            border-radius: 8px;
            text-align: center;
            min-width: 160px;
            background: transparent;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(226, 54, 54, 0.15);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 20px 60px rgba(226, 54, 54, 0.25);
        }

        /* Animated corner accents */
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border-top: 2px solid rgba(226, 54, 54, 0.9);
            border-left: 2px solid rgba(226, 54, 54, 0.9);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            border-bottom: 2px solid rgba(229, 169, 61, 0.9);
            border-right: 2px solid rgba(229, 169, 61, 0.9);
        }

        /* Animated top line sweep */
        .card-sweep {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(226, 54, 54, 0.9), rgba(255, 183, 0, 0.8), transparent);
            animation: card-line 3s ease-in-out infinite;
        }

        .stat-card:nth-child(2) .card-sweep {
            animation-delay: 1.5s;
        }

        @keyframes card-line {
            0% {
                left: -100%;
            }

            50% {
                left: 100%;
            }

            100% {
                left: 100%;
            }
        }

        .stat-value {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 700;
            color: #fff;
            text-shadow:
                0 0 10px rgba(226, 54, 54, 0.9),
                0 0 30px rgba(255, 183, 0, 0.5);
            line-height: 1;
            letter-spacing: 2px;
        }

        .stat-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            color: rgba(255, 183, 0, 0.85);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 6px;
            font-weight: 700;
        }

        /* Radar sweep inside card */
        .card-radar {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(226, 54, 54, 0.3);
            overflow: hidden;
        }

        .card-radar::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%;
            height: 2px;
            background: rgba(226, 54, 54, 0.9);
            transform-origin: left center;
            animation: radar-sweep 2s linear infinite;
        }

        @keyframes radar-sweep {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);

        /* ---- LOADING SCREEN ---- */

                    <div class="stat-label">PREMIUM EVENTS</div>
                </div>

                <!-- Explore Button -->
                <a href="home.html" class="explore-btn-container">
                    <div class="explore-icon">
                        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <span class="explore-text">EXPLORE</span>
                </a>

                <div class="stat-card">
                    <div class="card-radar"></div>
                    <div class="stat-value">₹<span id="val2">0</span></div>
                    <div class="stat-label">TOTAL BOUNTY</div>
                </div>
            </div>
        </div><!-- /stage -->
    </div><!-- /cinematic-reveal -->

    <script>
        /* ================================================================
           THREE.JS COSMIC BACKGROUND (Vast Universe)
        ================================================================ */
        (function initCosmos() {
            const cosmosCanvas = document.getElementById('cosmic-canvas');
            const renderer = new THREE.WebGLRenderer({ canvas: cosmosCanvas, antialias: false, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); // transparent — lets new.png background show

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 600;

            // ---- Starfield ----
            const starGeo = new THREE.BufferGeometry();
            const starCount = 4000;
            const starPos = new Float32Array(starCount * 3);
            const starSize = new Float32Array(starCount);
            for (let i = 0; i < starCount; i++) {
                starPos[i * 3] = (Math.random() - 0.5) * 2000;
                starPos[i * 3 + 1] = (Math.random() - 0.5) * 2000;
                starPos[i * 3 + 2] = (Math.random() - 0.5) * 1500;
                starSize[i] = Math.random() * 2.5 + 0.3;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starGeo.setAttribute('size', new THREE.BufferAttribute(starSize, 1));
            const starMat = new THREE.ShaderMaterial({
                vertexShader: `
                    attribute float size;
                    varying float vAlpha;
                    void main() {
                        vAlpha = 0.5 + 0.5 * sin(position.x * 0.01 + position.y * 0.01);
                        vec4 mv = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = size * (500.0 / -mv.z);
                        gl_Position = projectionMatrix * mv;
                    }
                `,
                fragmentShader: `
                    varying float vAlpha;
                    void main() {
                        float d = distance(gl_PointCoord, vec2(0.5));
                        if (d > 0.5) discard;
                        float glow = 1.0 - d * 2.0;
                        // Warm white stars with slight amber/orange tint — no blue
                        gl_FragColor = vec4(1.0, 0.88 + 0.12 * vAlpha, 0.7 + 0.2 * vAlpha, glow * vAlpha);
                    }
                `,
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
            });
            scene.add(new THREE.Points(starGeo, starMat));

            // Particles disabled for clean loader sequence

            // Mouse tracking for parallax
            let mouseX = 0, mouseY = 0;
            document.addEventListener('mousemove', e => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            let cosmosTime = 0;

            function renderCosmos() {
                requestAnimationFrame(renderCosmos);
                cosmosTime += 0.003;

                // Slow camera orbit
                camera.position.x += (mouseX * 30 - camera.position.x) * 0.02;
                camera.position.y += (-mouseY * 20 - camera.position.y) * 0.02;
                camera.lookAt(scene.position);

                renderer.render(scene, camera);
            }
            renderCosmos();
        })();

        /* ================================================================
           MOUSE PARALLAX ON STAGE (Logo + HUD + Cards)
        ================================================================ */
        const stage = document.getElementById('stage');
        document.addEventListener('mousemove', e => {
            const x = (e.clientX / window.innerWidth - 0.5) * 18;
            const y = (e.clientY / window.innerHeight - 0.5) * 12;
            stage.style.transform = `translate(${x}px, ${y}px)`;
        });

        /* ================================================================
           AUTO-LOADING SEQUENCE  (<1 s loading → cinematic auto-starts)
        ================================================================ */
        const loadingScreen = document.getElementById('loading-screen');
        const loadingBar = document.getElementById('loading-bar');
        const loadingStatus = document.getElementById('loading-status');
        const marvelIntro = document.getElementById('marvel-intro');

        const statusMessages = ['Initializing\u2026', 'Loading assets/u2026', 'Calibrating HUD\u2026', 'Ready'];
        let msgIdx = 0;

        // Cycle status text quickly
        const statusInterval = setInterval(() => {
            msgIdx++;
            if (msgIdx < statusMessages.length) {
                loadingStatus.textContent = statusMessages[msgIdx];
            } else {
                clearInterval(statusInterval);
            }
        }, 450);

        // Animate the bar to 100% over ~700ms
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                loadingBar.style.width = '100%';
            });
        });

        // After loading screen fades out, jump DIRECTLY to cinematic page (no red page)
        setTimeout(() => {
            clearInterval(statusInterval);

            gsap.to(loadingScreen, {
                opacity: 0,
                duration: 0.4,
                ease: 'power2.inOut',
                onComplete: () => {
                    loadingScreen.style.display = 'none';
                    startCinematic();
                }
            });
        }, 1500);

        function startTypewriter() {
            const line1 = document.getElementById('typeLine1');
            const line2 = document.getElementById('typeLine2');
            const str1 = "IEEE SC";
            const str2 = "- 12951 -";
            let idx1 = 0, idx2 = 0;

            if (line1) line1.textContent = "";
            if (line2) line2.textContent = "";

            const timer1 = setInterval(() => {
                if (idx1 < str1.length) {
                    line1.textContent += str1.charAt(idx1);
                    idx1++;
                } else {
                    clearInterval(timer1);
                    const timer2 = setInterval(() => {
                        if (idx2 < str2.length) {
                            line2.textContent += str2.charAt(idx2);
                            idx2++;
                        } else {
                            clearInterval(timer2);
                            setTimeout(startCinematic, 700);
                        }
                    }, 45);
                }
            }, 55);
        }

        /* ================================================================
           GSAP MASTER TIMELINE
        ================================================================ */
        function startCinematic() {
            const tl = gsap.timeline();

            // Jump directly to cinematic page (marvel-intro is already hidden)
            tl.set('#marvel-intro', { display: 'none' })
                .to('#cinematic-reveal', { opacity: 1, duration: 0.5, ease: "power2.out" }, 0)

                // HUD rings materialise
                .to('#jarvis-hud', {
                    opacity: 1, duration: 0.75, ease: "power3.out",
                    filter: "drop-shadow(0 0 8px rgba(0,229,255,0.4))"
                }, 0.50)

                // Logo fades in cleanly without box scale animation
                .fromTo('#logo-core', {
                    opacity: 0, scale: 1,
                    filter: "brightness(1.5) blur(6px)"
                }, {
                    opacity: 1, scale: 1,
                    filter: "brightness(1) blur(0px)",
                    duration: 0.8, ease: "power2.out"
                }, 1.40)

                // Screen shake removed

                // JARVIS hologram flicker
                .to('#srishtiLogo', { opacity: 0.3, duration: 0.06 }, 1.85)
                .to('#srishtiLogo', { opacity: 1, duration: 0.06 }, 1.93)
                .to('#srishtiLogo', { opacity: 0.5, duration: 0.06 }, 2.01)
                .to('#srishtiLogo', { opacity: 1, duration: 0.18, ease: "power2.out" }, 2.09)

                // === STAT CARDS ===
                .fromTo('#stat-cards', { opacity: 0, y: 35 }, {
                    opacity: 1, y: 0, duration: 0.6, ease: "expo.out"
                }, 2.40)

                .to({ val: 0 }, {
                    val: 30, duration: 1.1, ease: "power2.out",
                    onUpdate: function () {
                        document.getElementById('val1').innerText = Math.floor(this.targets()[0].val) + "+";
                    }
                }, 2.60)
                .to({ val: 0 }, {
                    val: 100000, duration: 1.1, ease: "power2.out",
                    onUpdate: function () {
                        document.getElementById('val2').innerText = Math.floor(this.targets()[0].val).toLocaleString();
                    }
                }, 2.60);
        }

        /* ================================================================
           THOR LIGHTNING ENGINE
        ================================================================ */
        (function thorLightning() {
            const container = document.getElementById('lightning-container');
            const ringsEl = document.getElementById('thunder-rings');
            const burst = document.getElementById('mjolnir-burst');

            /* --- Draw a jagged SVG lightning bolt --- */
            function makeBolt(x1, y1, x2, y2, branches) {
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('width', '100%');
                svg.setAttribute('height', '100%');
                svg.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;overflow:visible;';

                function jaggedPath(ax, ay, bx, by, depth) {
                    if (depth === 0) return [[ax, ay], [bx, by]];
                    const mx = (ax + bx) / 2 + (Math.random() - 0.5) * (Math.abs(bx - ax) + Math.abs(by - ay)) * 0.45;
                    const my = (ay + by) / 2 + (Math.random() - 0.5) * (Math.abs(bx - ax) + Math.abs(by - ay)) * 0.45;
                    return [...jaggedPath(ax, ay, mx, my, depth - 1), ...jaggedPath(mx, my, bx, by, depth - 1).slice(1)];
                }

                function drawSegment(pts, color, w, opacity) {
                    const d = 'M ' + pts.map(p => p[0] + ',' + p[1]).join(' L ');
                    const glowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    glowPath.setAttribute('d', d);
                    glowPath.setAttribute('stroke', color);
                    glowPath.setAttribute('stroke-width', w * 4);
                    glowPath.setAttribute('fill', 'none');
                    glowPath.setAttribute('opacity', opacity * 0.3);
                    glowPath.setAttribute('stroke-linecap', 'round');
                    svg.appendChild(glowPath);
                    const corePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    corePath.setAttribute('d', d);
                    corePath.setAttribute('stroke', '#ffffff');
                    corePath.setAttribute('stroke-width', w);
                    corePath.setAttribute('fill', 'none');
                    corePath.setAttribute('opacity', opacity);
                    corePath.setAttribute('stroke-linecap', 'round');
                    svg.appendChild(corePath);
                }

                const pts = jaggedPath(x1, y1, x2, y2, 4);
                const colors = ['#00cfff', '#a855ff', '#ffffff'];
                const col = colors[Math.floor(Math.random() * colors.length)];
                drawSegment(pts, col, 1.5 + Math.random() * 2, 0.85 + Math.random() * 0.15);

                // Random branches
                if (branches > 0) {
                    const branchIdx = Math.floor(pts.length * 0.3 + Math.random() * pts.length * 0.4);
                    const bp = pts[branchIdx];
                    const bx2 = bp[0] + (Math.random() - 0.5) * 200;
                    const by2 = bp[1] + Math.random() * 150 + 60;
                    const bpts = jaggedPath(bp[0], bp[1], bx2, by2, 3);
                    drawSegment(bpts, col, 0.8, 0.55);
                }

                return svg;
            }

            /* --- Spawn a thunder shockwave ring --- */
            function spawnRing(w, h) {
                const ring = document.createElement('div');
                ring.className = 'thunder-ring';
                ring.style.cssText = `width:${w}px;height:${h}px;`;
                ringsEl.appendChild(ring);
                setTimeout(() => ring.remove(), 1500);
            }

            /* --- Trigger a Mjolnir impact burst --- */
            function mjolnirImpact() {
                burst.classList.remove('mjolnir-impact');
                void burst.offsetWidth; // reflow
                burst.classList.add('mjolnir-impact');
                // Concentric rings disabled
            }

            /* --- Main lightning strike --- */
            function strike() {
                const W = window.innerWidth;
                const H = window.innerHeight;
                const x1 = W * (0.1 + Math.random() * 0.8);
                const y1 = 0;
                const x2 = x1 + (Math.random() - 0.5) * 300;
                const y2 = H * (0.4 + Math.random() * 0.5);
                const bolt = makeBolt(x1, y1, x2, y2, Math.random() < 0.6 ? 1 : 0);
                container.appendChild(bolt);

                // Double flash
                setTimeout(() => {
                    const bolt2 = makeBolt(x1 + (Math.random() - 0.5) * 20, y1, x2 + (Math.random() - 0.5) * 20, y2, 0);
                    container.appendChild(bolt2);
                    setTimeout(() => bolt2.remove(), 80);
                }, 60);

                // Occasionally trigger Mjolnir impact
                if (Math.random() < 0.35) mjolnirImpact();

                const dur = 120 + Math.random() * 100;
                setTimeout(() => bolt.remove(), dur);

                // Schedule next
                const next = 600 + Math.random() * 2800;
                setTimeout(strike, next);
            }

            // Start after phase 2 begins (~2.95s into cinematic)
            setTimeout(strike, 2950);
        })();
    </script>
